name: ci

on:
  push:
    branches: [main, v2-hardening]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # A library that moves wind turbines does not get to merge unformatted
      # code, and gofmt has no exit status of its own.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt'ed:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The live tests sit behind a build tag, so they are never compiled by the
      # steps above. Vetting them with the tag keeps them from rotting.
      - name: go vet (live tests)
        run: go vet -tags opc_integration ./...

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

      # -race matters here: the Client serialises commands per plant and browses
      # a park concurrently.
      - name: go test -race
        run: go test -race -count=1 -coverprofile=cover.out ./...

      - name: coverage floor
        run: |
          total="$(go tool cover -func=cover.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')"
          echo "total coverage: ${total}%"
          # Raise the floor when it is comfortably exceeded; never lower it to
          # make a build pass.
          awk -v t="$total" 'BEGIN { exit (t >= 85.0) ? 0 : 1 }' || {
            echo "coverage ${total}% is below the 85% floor"
            exit 1
          }
